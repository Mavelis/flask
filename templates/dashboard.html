<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | Книга будущего</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            color: #fff;
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
        }
        .dashboard-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            text-align: center;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #00ffcc;
        }
        .code {
            font-size: 2rem;
            margin: 20px 0;
            color: #00ffcc;
            animation: glow 2s infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc; }
            to { text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc; }
        }
        .info {
            margin-top: 30px;
        }
        .info p {
            font-size: 1.2rem;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>Личный кабинет</h1>
        <p>Добро пожаловать, {{ user.name }}!</p>
        <div class="code">Ваш уникальный код: {{ user.code }}</div>
        <a href="/logout" class="logout-button">Выйти</a>
    </div>
</body>
</html>
